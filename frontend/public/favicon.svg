<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC4FF"/>
      <stop offset="0.55" stop-color="#3B7BFF"/>
      <stop offset="1" stop-color="#2A4FE0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#8BE9FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8BE9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.8" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0A2A8A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#blobA)"/>
  <rect width="64" height="64" rx="16" fill="url(#blobB)"/>
  <!-- frosted glass pane -->
  <rect x="11" y="11" width="42" height="42" rx="12" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
  <!-- check mark -->
  <path d="M22 33.5 29 40.5 43 25" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <!-- top gloss -->
  <path d="M4 20C4 9 9 4 20 4h24c8 0 14 4 15 11-9 6-22 8-55 5z" fill="#fff" opacity="0.22"/>
</svg>
