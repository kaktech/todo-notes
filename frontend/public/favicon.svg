<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC4FF"/>
      <stop offset="0.55" stop-color="#3B7BFF"/>
      <stop offset="1" stop-color="#2A4FE0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.80"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.2" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#8BE9FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8BE9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0A2A8A" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#blobA)"/>
  <rect width="64" height="64" rx="16" fill="url(#blobB)"/>
  <!-- the pane: a frosted sheet of glass with a diagonal glint -->
  <rect x="10" y="10" width="44" height="44" rx="14" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M15 40 40 15" stroke="#fff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <path d="M15 47 47 15" stroke="#fff" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
  <!-- P -->
  <path d="M26 45V19h9.5a8 8 0 0 1 0 16H26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
</svg>
