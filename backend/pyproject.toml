[tool.poetry]
name = "backend"
version = "1.0.0"
description = "Todo & Notes API"
authors = ["kaktech"]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "0.115.6"
uvicorn = "0.34.0"
sqlalchemy = "2.0.36"
pydantic = "2.10.4"
pytest = "8.3.4"
httpx = "0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
